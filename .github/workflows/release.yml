name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  verify-version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      commit: ${{ steps.check.outputs.commit }}
      tag: ${{ steps.check.outputs.tag }}
      channel: ${{ steps.check.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: check
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/ci/release.py guard "$RELEASE_TAG"
      - name: Reject existing release (including draft)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.check.outputs.tag }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' > /tmp/release-tags
          if grep -Fxq "$RELEASE_TAG" /tmp/release-tags; then
            echo '::error::Release already exists; choose a new version.'
            exit 1
          fi
  package:
    needs: verify-version
    uses: ./.github/workflows/firmware-build.yml
    with:
      ref: ${{ needs.verify-version.outputs.commit }}
      channel: ${{ needs.verify-version.outputs.channel }}
  publish:
    name: Create draft release
    needs: [verify-version, package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify-version.outputs.version }}
      COMMIT: ${{ needs.verify-version.outputs.commit }}
      RELEASE_TAG: ${{ needs.verify-version.outputs.tag }}
      CHANNEL: ${{ needs.verify-version.outputs.channel }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-version.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true
      - name: Verify complete artifact set and provenance
        run: |
          python scripts/ci/release.py verify artifacts --version "$VERSION" --commit "$COMMIT" \
            --expected windows-x86,windows-x64,windows-arm64,linux-x64,linux-arm64,linux-armhf
          cd artifacts
          sha256sum -c SHA256SUMS
      - name: Extract release notes and record CI audit data
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          printf '\nBuild: %s/%s/actions/runs/%s\nCommit: %s\nActor: %s\nChannel: %s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$COMMIT" "$GITHUB_ACTOR" "$CHANNEL" >> RELEASE_NOTES.md
      - name: Generate signed OTA manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          key="$RUNNER_TEMP/update-signing-key.pem"
          trap 'rm -f "$key"' EXIT
          args=()
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            umask 077
            printf '%s' "$UPDATE_SIGNING_KEY" > "$key"
            openssl pkey -in "$key" -noout
            args=(--key "$key")
          else
            echo '::warning::Unsigned draft: production gateways will reject its OTA manifest.'
          fi
          bash scripts/make-manifest.sh --version "$VERSION" --dir artifacts --channel "$CHANNEL" \
            --base-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG" \
            --notes RELEASE_NOTES.md "${args[@]}"
      - name: Create a new draft without overwriting an existing release
        run: |
          # POST creation rejects an existing tag; never use update/upload --clobber.
          jq -n --arg tag "$RELEASE_TAG" --arg name "eMaster Gateway $VERSION" \
            --arg channel "$CHANNEL" --rawfile body RELEASE_NOTES.md \
            '{tag_name:$tag,name:$name,body:$body,draft:true,prerelease:($channel!="stable")}' > "$RUNNER_TEMP/release.json"
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases" --input "$RUNNER_TEMP/release.json"
          gh release upload "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY"
