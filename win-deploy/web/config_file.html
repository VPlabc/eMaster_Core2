<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eMaster Gateway - Configuration File</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet"><script src="js/theme.js"></script><script src="js/auth.js"></script>
</head><body><div id="hsfNav"></div><main class="container py-4">
  <h1 class="h3">Configuration Files</h1>
  <p class="text-muted">Configuration status is visible to all authenticated users. Raw configuration and sensitive values are restricted to administrators.</p>
  <div id="configStatusCard" class="card mb-3"><div class="card-body"><div class="row g-2"><div class="col-md-3"><span class="text-muted">Status</span><div id="configStatus">Checking…</div></div><div class="col-md-3"><span class="text-muted">Version</span><div id="configVersion">—</div></div><div class="col-md-6"><span class="text-muted">Security</span><div>Sensitive configuration is hidden from normal users.</div></div></div></div></div>
  <div class="card" id="configAdminCard" data-hsf-admin hidden><div class="card-header">Administrator configuration management</div><div class="card-body">
    <textarea id="configEditor" class="form-control font-monospace mb-2" rows="16" spellcheck="false" placeholder="Loading configuration…"></textarea>
    <div class="d-flex gap-2 flex-wrap"><button class="btn btn-outline-secondary" id="validateConfig">Validate</button><button class="btn btn-primary" id="saveConfig">Save / Apply</button><button class="btn btn-outline-secondary" id="exportConfig">Export configuration</button><label class="btn btn-outline-primary mb-0">Import configuration<input type="file" id="importConfig" accept=".json,application/json" hidden></label><span id="configResult" class="small align-self-center"></span></div>
  </div></div>
</main><script src="js/layout.js"></script><script src="js/config_file.js"></script></body></html>
