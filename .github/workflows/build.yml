name: Gateway CI
on:
  push:
    branches: [main, develop, 'release/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop, 'release/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gateway-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      build: ${{ steps.paths.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Detect affected components
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            python scripts/ci/changes.py "$BASE" HEAD
          fi
      - name: Compile CI tooling and run release contract tests
        run: |
          python -m compileall -q scripts/ci
          python -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Validate shell and WebUI syntax
        run: |
          git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n
          git ls-files -z 'web/*.js' 'web/**/*.js' | xargs -0 -r -n1 node --check
  firmware-server:
    name: Firmware Server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/firmware_server/requirements.txt
      - name: Install server dependencies
        run: python -m pip install -r tools/firmware_server/requirements.txt
      - name: Compile server and simulator
        run: python -m compileall -q tools/firmware_server scripts/firmware_server_smoke.py
      - name: Test firmware API and real HTTP lifecycle
        run: python -m unittest tools.firmware_server.test_server -v
  firmware:
    needs: validate
    if: needs.validate.outputs.build == 'true'
    uses: ./.github/workflows/firmware-build.yml
    with:
      ref: ${{ github.sha }}
  required:
    name: Gateway CI required
    if: always()
    needs: [validate, firmware, firmware-server]
    runs-on: ubuntu-22.04
    steps:
      - env:
          VALIDATE: ${{ needs.validate.result }}
          FIRMWARE: ${{ needs.firmware.result }}
          SERVER: ${{ needs.firmware-server.result }}
        run: |
          test "$VALIDATE" = success
          test "$SERVER" = success
          test "$FIRMWARE" = success || test "$FIRMWARE" = skipped
