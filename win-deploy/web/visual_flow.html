<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eMaster Gateway - Visual Flow Runtime</title>
  <meta name="hsf-require-role" content="admin">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet"><script src="js/theme.js"></script><script src="js/auth.js"></script>
</head>
<body>
  <div id="hsfNav"></div>
  <main class="container-fluid py-3">
    <ul class="nav nav-tabs mb-3" aria-label="Edge Logic workspace">
      <li class="nav-item"><a class="nav-link" href="/lua_editor.html">Lua Script</a></li>
      <li class="nav-item"><a class="nav-link active" href="/visual_flow.html">Visual Flow Runtime</a></li>
    </ul>
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div><h1 class="h3 mb-1">Visual Flow Runtime</h1><p class="text-muted mb-0">Flow Definition v1 — portable JSON model prepared for future runtimes.</p></div>
      <span class="badge text-bg-secondary" id="flowState">Stopped</span>
    </div>
    <div class="row g-3">
      <aside class="col-12 col-lg-2">
        <div class="card"><div class="card-header">Node Library</div><div class="list-group list-group-flush" id="flowNodeLibrary"></div></div>
      </aside>
      <section class="col-12 col-lg-7">
        <div class="card h-100"><div class="card-header d-flex justify-content-between"><span>Flow Canvas</span><small class="text-muted">Click a node to add it</small></div><div class="card-body"><div id="flowCanvas" class="border rounded p-3 d-flex flex-wrap gap-2 align-content-start" style="min-height:26rem"></div></div></div>
      </section>
      <aside class="col-12 col-lg-3">
        <div class="card"><div class="card-header">Flow Definition</div><div class="card-body"><textarea id="flowJson" class="form-control font-monospace" rows="16" spellcheck="false"></textarea><div id="flowResult" class="small mt-2"></div></div></div>
        <div class="card mt-3"><div class="card-header">Node Properties</div><div class="card-body"><div id="flowSelection" class="small text-muted mb-2">Select a node to edit it.</div><textarea id="flowProperties" class="form-control font-monospace" rows="6" placeholder='{"label":"..."}' disabled></textarea><button class="btn btn-sm btn-outline-primary mt-2" id="flowApplyProperties" disabled>Apply</button></div></div>
      </aside>
    </div>
    <div class="d-flex gap-2 mt-3 flex-wrap"><button class="btn btn-success" id="flowStart">Start</button><button class="btn btn-outline-danger" id="flowStop">Stop</button><button class="btn btn-outline-warning" id="flowRestart">Restart</button><button class="btn btn-outline-secondary" id="flowValidate">Validate</button><button class="btn btn-primary" id="flowSave">Save</button><button class="btn btn-outline-secondary" id="flowLoad">Load</button><span class="small text-muted align-self-center" id="flowEventCount">0 runtime events</span></div>
  </main>
  <script src="js/layout.js"></script><script src="js/visual_flow.js"></script>
</body>
</html>
