<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eMaster Gateway - Sign in</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
  <!-- Must run before first paint so the stored theme is already on <html>;
       loading it with the scripts at the end of <body> flashes light-then-dark. -->
  <script src="js/theme.js"></script>
  <!-- auth.js bounces straight to the dashboard if a session already exists. -->
  <script src="js/auth.js"></script>
</head>
<body class="hsf-login-body">
  <button class="hsf-theme-toggle hsf-login-theme" data-hsf-theme-toggle type="button"
          title="Toggle light / dark theme" aria-label="Toggle light / dark theme">
    <span class="icon-light" aria-hidden="true">&#9788;</span>
    <span class="icon-dark" aria-hidden="true">&#9790;</span>
  </button>

  <main class="hsf-login-wrap">
    <form class="card p-4 hsf-login-card" id="loginForm" autocomplete="on">
      <div class="text-center mb-4">
        <div class="hsf-login-mark" aria-hidden="true">HSF</div>
        <h1 class="h5 mb-1">eMaster Gateway</h1>
        <div class="text-muted small">Sign in to continue</div>
      </div>

      <div class="alert alert-danger py-2 d-none" id="loginError" role="alert"></div>

      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <input class="form-control" id="username" name="username" type="text"
               autocomplete="username" required autofocus>
      </div>

      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password"
               autocomplete="current-password" required>
      </div>

      <button class="btn btn-primary w-100" type="submit" id="loginSubmit">Sign in</button>

    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
